name: Deploy backend via FTPS and cPanel API (disabled by default)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-ftps-cpanel.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Upload code after preflight. Requires BACKEND_FTPS_CPANEL_DEPLOY_ENABLED=true.'
        required: true
        default: false
        type: boolean
      release_ref:
        description: 'Optional known-good commit SHA for a controlled rollback/redeploy.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend-ftps-cpanel-deploy
  cancel-in-progress: false

env:
  # FTP paths are relative to the cPanel account home directory, not /home/... .
  APP_PATH_RELATIVE: apps/english-course/backend
  HEALTH_URL: https://api.toeicmsuyen.vn/health

jobs:
  verify:
    name: Verify backend on Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test:phase1

  preflight:
    name: Verify FTPS and cPanel Passenger API
    needs: verify
    # A manual run with deploy=false performs read-only connectivity checks. A
    # push reaches this job only after the explicit repository-variable gate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.BACKEND_FTPS_CPANEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      FTPS_HOST: ${{ secrets.LONGVAN_FTPS_HOST }}
      FTPS_USER: ${{ secrets.LONGVAN_FTPS_USER }}
      FTPS_PASSWORD: ${{ secrets.LONGVAN_FTPS_PASSWORD }}
      CPANEL_HOST: ${{ secrets.LONGVAN_CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.LONGVAN_CPANEL_USER }}
      CPANEL_API_TOKEN: ${{ secrets.LONGVAN_CPANEL_API_TOKEN }}
    steps:
      - name: Check required secrets are present
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${FTPS_HOST:?Missing LONGVAN_FTPS_HOST}"
          : "${FTPS_USER:?Missing LONGVAN_FTPS_USER}"
          : "${FTPS_PASSWORD:?Missing LONGVAN_FTPS_PASSWORD}"
          : "${CPANEL_HOST:?Missing LONGVAN_CPANEL_HOST}"
          : "${CPANEL_USER:?Missing LONGVAN_CPANEL_USER}"
          : "${CPANEL_API_TOKEN:?Missing LONGVAN_CPANEL_API_TOKEN}"

      - name: Verify authenticated explicit FTPS access without writing files
        shell: bash
        run: |
          set -Eeuo pipefail
          # curl verifies the FTPS certificate. Do not weaken this with -k.
          curl --fail --silent --show-error --ftp-ssl --user "$FTPS_USER:$FTPS_PASSWORD" \
            "ftp://$FTPS_HOST:21/$APP_PATH_RELATIVE/" >/dev/null

      - name: Verify cPanel account can see the Passenger application
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/PassengerApps/list_applications")"
          printf '%s' "$response" | jq -e '.result.status == 1' >/dev/null
          # Do not upload anything unless this cPanel account reports an
          # application rooted at the expected, home-relative path.
          printf '%s' "$response" | jq -e --arg path "$APP_PATH_RELATIVE" '
            .. | objects | select((.path? // "") | sub("^/home/[^/]+/"; "") == $path)
          ' >/dev/null \
            || { echo "PassengerApps did not report $APP_PATH_RELATIVE. Confirm Long Van exposes the Node.js Selector application through cPanel UAPI before enabling deploy." >&2; exit 31; }

  deploy:
    name: Upload code, install dependencies, and restart Passenger
    needs: preflight
    # This is the production safety switch. It is deliberately unset/false in
    # a new repository, so adding this workflow cannot deploy production.
    if: >-
      vars.BACKEND_FTPS_CPANEL_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.deploy == true)
    runs-on: ubuntu-latest
    environment: longvan-production
    env:
      FTPS_HOST: ${{ secrets.LONGVAN_FTPS_HOST }}
      FTPS_USER: ${{ secrets.LONGVAN_FTPS_USER }}
      FTPS_PASSWORD: ${{ secrets.LONGVAN_FTPS_PASSWORD }}
      CPANEL_HOST: ${{ secrets.LONGVAN_CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.LONGVAN_CPANEL_USER }}
      CPANEL_API_TOKEN: ${{ secrets.LONGVAN_CPANEL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Create Passenger restart signal in the release payload
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p backend/tmp
          date -u +%s > backend/tmp/restart.txt

      - name: Upload backend through explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LONGVAN_FTPS_HOST }}
          username: ${{ secrets.LONGVAN_FTPS_USER }}
          password: ${{ secrets.LONGVAN_FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backend/
          server-dir: ./apps/english-course/backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/node_modules/**
            **/uploads/**
            **/data/**
            **/logs/**
            **/.deploy-backups/**
            **/.deploy-staging/**

      - name: Ask cPanel Passenger API to install Node dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error --get \
            --header "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            --data-urlencode 'type=npm' \
            --data-urlencode "app_path=$APP_PATH_RELATIVE" \
            "https://$CPANEL_HOST:2083/execute/PassengerApps/ensure_deps")"
          printf '%s' "$response" | jq -e '.result.status == 1' >/dev/null \
            || { echo "cPanel refused or failed the Passenger dependency install. No automatic rollback is attempted; redeploy a known-good release only after reviewing the cPanel error." >&2; exit 41; }

      - name: Verify the public health endpoint after Passenger restart
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 20 "$HEALTH_URL" | grep -q '"status":"success"'

      - name: Explain safe recovery when post-deploy verification fails
        if: failure()
        shell: bash
        run: |
          echo "Deployment verification failed. This FTPS/UAPI workflow intentionally does not overwrite .env, uploads, data, logs, or node_modules and cannot make an atomic server-side rollback without shell access."
          echo "Keep BACKEND_FTPS_CPANEL_DEPLOY_ENABLED=false until Long Van confirms backups, or rerun this workflow manually with deploy=true and release_ref set to a known-good commit SHA after reviewing Passenger/cPanel logs."
