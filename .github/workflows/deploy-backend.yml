name: Deploy backend to Long Van via Explicit FTPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Upload after the read-only preflight and cPanel confirmation.'
        required: true
        default: false
        type: boolean
      release_ref:
        description: 'Optional known-good commit SHA for a controlled redeploy.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend-ftps-deploy
  cancel-in-progress: false

env:
  # FTP paths are relative to the authenticated FTP account home directory.
  APP_PATH_RELATIVE: apps/english-course/backend
  EXPECTED_DOMAIN: api.toeicmsuyen.vn
  EXPECTED_STARTUP_FILE: app.js
  EXPECTED_NODE_VERSION: 22.23.4
  HEALTH_URL: https://api.toeicmsuyen.vn/health

jobs:
  verify:
    name: Verify backend on Node 22.23.4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run offline security regression tests
        run: npm run test:phase1

  authorize:
    name: Authorize read-only preflight and production upload
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      run_preflight: ${{ steps.gate.outputs.run_preflight }}
      run_deploy: ${{ steps.gate.outputs.run_deploy }}
    env:
      # These two guards are deliberately Secrets because that is where the
      # repository's deployment authority is held. GitHub does not allow
      # secrets directly in a job-level if expression. The output tokens below
      # intentionally are not `true`/`false`: GitHub suppresses a job output
      # that equals a Secret value, and both deploy Secrets legitimately use
      # the value `true`.
      DEPLOY_ENABLED: ${{ secrets.BACKEND_FTPS_DEPLOY_ENABLED }}
      SELECTOR_VERIFIED: ${{ secrets.CLOUDLINUX_NODE_SELECTOR_VERIFIED }}
      REQUESTED_DEPLOY: ${{ inputs.deploy }}
    steps:
      - id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          run_preflight=preflight-blocked
          run_deploy=deploy-blocked

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$DEPLOY_ENABLED" == 'true' ]]; then
            run_preflight=preflight-approved
          fi
          if [[ ( "$GITHUB_EVENT_NAME" == 'push' || "$REQUESTED_DEPLOY" == 'true' ) \
            && "$DEPLOY_ENABLED" == 'true' && "$SELECTOR_VERIFIED" == 'true' ]]; then
            run_deploy=deploy-approved
          fi

          printf 'run_preflight=%s\n' "$run_preflight" >> "$GITHUB_OUTPUT"
          printf 'run_deploy=%s\n' "$run_deploy" >> "$GITHUB_OUTPUT"

  preflight:
    name: Verify CloudLinux target, FTPS mapping, and public domain
    needs: authorize
    # A manual run with deploy=false is read-only. Pushes only reach this job
    # after the separate production gate has been enabled deliberately.
    if: >-
      needs.authorize.outputs.run_preflight == 'preflight-approved'
    runs-on: ubuntu-latest
    env:
      FTPS_HOST: ${{ secrets.LONGVAN_FTPS_HOST }}
      FTPS_USER: ${{ secrets.LONGVAN_FTPS_USER }}
      FTPS_PASSWORD: ${{ secrets.LONGVAN_FTPS_PASSWORD }}
      # CloudLinux Selector is reviewed in cPanel before this Secret is set.
      # The expected target configuration remains immutable in workflow env.
      SELECTOR_VERIFIED: ${{ secrets.CLOUDLINUX_NODE_SELECTOR_VERIFIED }}
    steps:
      - name: Check required secrets and reviewed Node.js Selector target
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${FTPS_HOST:?Missing LONGVAN_FTPS_HOST}"
          : "${FTPS_USER:?Missing LONGVAN_FTPS_USER}"
          : "${FTPS_PASSWORD:?Missing LONGVAN_FTPS_PASSWORD}"

          [[ "$SELECTOR_VERIFIED" == 'true' ]] \
            || { echo 'CloudLinux configuration has not been explicitly reviewed in cPanel.' >&2; exit 21; }

      - name: Verify authenticated explicit-FTPS path mapping without writing
        shell: bash
        run: |
          set -Eeuo pipefail
          # curl validates the FTPS certificate; do not add --insecure/-k.
          # A successful listing proves that this authenticated FTP home maps
          # exactly to apps/english-course/backend, not merely to a similarly
          # named local path.
          curl --fail --silent --show-error --ftp-ssl-reqd --list-only \
            --user "$FTPS_USER:$FTPS_PASSWORD" \
            "ftp://$FTPS_HOST:21/$APP_PATH_RELATIVE/" >/dev/null

          # Confirm the actual upload target contains the Selector startup
          # file. This is read-only and never reads .env.
          curl --fail --silent --show-error --ftp-ssl-reqd \
            --user "$FTPS_USER:$FTPS_PASSWORD" \
            "ftp://$FTPS_HOST:21/$APP_PATH_RELATIVE/$EXPECTED_STARTUP_FILE" \
            | grep -Fq "./src/server.js"

      - name: Verify the configured domain reaches the expected Node.js runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$HEALTH_URL")"
          if printf '%s' "$response" | jq -e \
            '.status == "success" and .env == "production"' >/dev/null 2>&1; then
            echo 'Domain is already serving the backend production health route.'
          elif [[ "$response" == *'It works!'* && "$response" == *"NodeJS $EXPECTED_NODE_VERSION"* ]]; then
            # CloudLinux Selector's initial response is accepted only for the
            # first code upload. The cPanel UI review and exact FTPS mapping
            # above still bind this release to the reviewed application.
            echo 'Domain is serving the CloudLinux Node.js Selector default response.'
          else
            echo 'Domain did not return the backend health JSON or the expected CloudLinux Node.js Selector response.' >&2
            exit 27
          fi

  deploy:
    name: Upload backend through explicit FTPS
    needs: [authorize, preflight]
    # Both gates are required. The default/unset value of either one prevents
    # production writes, including on a push to main.
    if: >-
      needs.authorize.outputs.run_deploy == 'deploy-approved'
    runs-on: ubuntu-latest
    environment: longvan-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Upload backend through explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LONGVAN_FTPS_HOST }}
          username: ${{ secrets.LONGVAN_FTPS_USER }}
          password: ${{ secrets.LONGVAN_FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backend/
          server-dir: ./apps/english-course/backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env/**
            **/node_modules/**
            **/uploads/**
            **/data/**
            **/logs/**
            **/tmp/**
            **/.deploy-backups/**
            **/.deploy-staging/**

      - name: State required CloudLinux Node.js Selector actions
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Upload completed. No PassengerApps API, npm install, or restart was attempted.'
          echo 'In cPanel -> Setup Node.js App, select api.toeicmsuyen.vn / apps/english-course/backend, click Run NPM Install if dependencies changed, then click Restart.'
          echo "Finally verify $HEALTH_URL returns status=success and env=production."
